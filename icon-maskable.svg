<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a4e"/>
      <stop offset="100%" stop-color="#0a1a3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (for maskable safe zone) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Content within safe zone (80% = 40px padding each side, 432x432 area) -->
  <circle cx="256" cy="230" r="105" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>
  <line x1="181" y1="155" x2="331" y2="305" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round"/>

  <rect x="164" y="213" width="140" height="26" rx="6" fill="rgba(230,230,230,0.8)"/>
  <rect x="304" y="213" width="44" height="26" rx="6" fill="rgba(205,160,100,0.8)"/>

  <text x="256" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="800" fill="url(#accentGrad)">BEZ PAPIEROSA</text>
</svg>
