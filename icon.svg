<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a4e"/>
      <stop offset="100%" stop-color="#0a1a3e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer glow ring -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3"/>

  <!-- No-smoking circle -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Diagonal slash -->
  <line x1="171" y1="135" x2="341" y2="305" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cigarette body (white part) -->
  <rect x="148" y="204" width="172" height="32" rx="8" fill="rgba(230,230,230,0.85)"/>

  <!-- Cigarette filter (tan/brown) -->
  <rect x="320" y="204" width="54" height="32" rx="8" fill="rgba(205,160,100,0.85)"/>

  <!-- Filter lines -->
  <line x1="336" y1="210" x2="336" y2="230" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="348" y1="210" x2="348" y2="230" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <line x1="360" y1="210" x2="360" y2="230" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>

  <!-- Days label at bottom -->
  <text x="256" y="410" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="800" fill="url(#accentGrad)" filter="url(#glow)">BEZ PAPIEROSA</text>
</svg>
